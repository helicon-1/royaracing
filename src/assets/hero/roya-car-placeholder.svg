<svg viewBox="0 0 1600 500" width="1600" height="500" xmlns="http://www.w3.org/2000/svg">
  <title>Placeholder — Roya Racing car (real cutout photo pending)</title>

  <!-- rear wing -->
  <rect x="1420" y="110" width="18" height="90" fill="#26b7bd"/>
  <rect x="1338" y="110" width="18" height="90" fill="#26b7bd"/>
  <rect x="1350" y="118" width="150" height="16" rx="4" fill="#26b7bd"/>
  <rect x="1350" y="190" width="150" height="10" rx="3" fill="#26b7bd"/>

  <!-- rear wheel -->
  <circle cx="1180" cy="360" r="80" fill="#0b1030" stroke="#26b7bd" stroke-width="14"/>
  <circle cx="1180" cy="360" r="34" fill="#26b7bd"/>

  <!-- body / sidepod -->
  <path
    d="M180 300 C 260 220, 420 190, 620 190 L 1120 190 C 1220 190, 1280 230, 1300 300 L 1300 330
       C 1220 300, 900 310, 620 320 C 420 328, 280 340, 180 330 Z"
    fill="#26b7bd"
  />

  <!-- nose cone -->
  <path
    d="M 60 340 C 40 336, 30 330, 30 322 C 30 314, 60 308, 120 306 L 180 300 L 180 330 L 120 336 Z"
    fill="#26b7bd"
  />

  <!-- cockpit + halo -->
  <path d="M 640 190 C 660 150, 720 120, 780 120 C 840 120, 880 150, 890 190 Z" fill="#26b7bd"/>
  <path
    d="M 660 130 C 700 90, 780 90, 820 130"
    fill="none"
    stroke="#26b7bd"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- front wheel -->
  <circle cx="330" cy="360" r="80" fill="#0b1030" stroke="#26b7bd" stroke-width="14"/>
  <circle cx="330" cy="360" r="34" fill="#26b7bd"/>

  <!-- front wing -->
  <rect x="20" y="392" width="240" height="14" rx="4" fill="#26b7bd"/>
  <rect x="20" y="392" width="16" height="60" fill="#26b7bd"/>
  <rect x="244" y="392" width="16" height="60" fill="#26b7bd"/>
</svg>
